name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        haxe-version:
          # - stable
          - nightly
        target:
          - cpp

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Haxe
        uses: actions/cache@v6
        with:
          path: ${{ startsWith(runner.os, 'windows') && '%AppData%' || '~/haxe' }}
          key: ${{ runner.os }}-haxe

      - name: Install Lix
        uses: lix-pm/setup-lix@master

      - name: Install Haxe
        run: lix install haxe ${{ matrix.haxe-version }}

      - name: Install Haxe Libraries
        run: lix download

      - name: Compile hxcpp tools
        if: contains(matrix.target, 'cpp') && matrix.haxe-version == 'nightly'
        run: |
          HXCPP_LIBPATH=$(haxelib libpath hxcpp)
          pushd "$HXCPP_LIBPATH"/tools/hxcpp
          haxe compile.hxml
          popd

      - name: Run Test
        run: lix run travix ${{ matrix.target }} ${{ matrix.flags }}
