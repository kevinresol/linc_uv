name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        haxe-version:
          - nightly
        target:
          - cpp

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Haxe
        uses: actions/cache@v6
        with:
          path: ${{ startsWith(runner.os, 'windows') && '%AppData%' || '~/haxe' }}
          key: ${{ runner.os }}-haxe-win-repro

      - name: Install Lix
        uses: lix-pm/setup-lix@master
        with:
          lix-version: 17.0.4-alpha.0

      - name: Overlay haxeshim from kevinresol/haxeshim@win (no WindowsExe wrap)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch win https://github.com/kevinresol/haxeshim.git /tmp/haxeshim
          cd /tmp/haxeshim
          lix download
          haxe all.hxml
          LIX_ROOT="$(npm root -g)/lix"
          cp -f bin/*.js "$LIX_ROOT/bin/"
          echo "Overlaid haxeshim shims from kevinresol/haxeshim@win into $LIX_ROOT/bin"
          ls -la "$LIX_ROOT/bin"
          git -C /tmp/haxeshim rev-parse HEAD
          git -C /tmp/haxeshim log -1 --oneline

      - name: Install Haxe
        run: lix install haxe ${{ matrix.haxe-version }}

      - name: Install Haxe Libraries
        run: lix download

      - name: Compile hxcpp tools (Windows)
        if: startsWith(runner.os, 'windows') && contains(matrix.target, 'cpp') && matrix.haxe-version == 'nightly'
        shell: pwsh
        run: |
          $HXCPP_LIBPATH = haxelib libpath hxcpp
          Set-Location "$HXCPP_LIBPATH/tools/hxcpp"
          haxe compile.hxml

      - name: Run Test
        run: lix run travix ${{ matrix.target }} ${{ matrix.flags }}
